<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<!-- Aucun script ni style intégré, aucune connexion : la page n'affiche que ce que NetVision lui envoie -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>NetVision</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="4"/><circle cx="16" cy="16" r="10" fill="none"/><circle cx="16" cy="16" r="14" fill="none"/><circle cx="26" cy="16" r="2.2" class="d"/><circle cx="9" cy="24" r="2.2" class="d"/><circle cx="7" cy="9" r="2.2" class="d"/></svg>
    <span>NetVision</span>
  </div>
  <div id="netinfo" class="netinfo"></div>
  <span class="spacer"></span>
  <div id="summary" class="summary"></div>
  <label class="auto"><input type="checkbox" id="autoscan"> Actualiser auto</label>
  <button class="btn primary" id="rescan"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg><span>Scanner</span></button>
</header>
<nav class="bar">
  <div class="views" role="tablist">
    <button role="tab" data-view="map" aria-selected="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><circle cx="12" cy="12" r="7" fill="none"/><circle cx="19" cy="12" r="1.6" class="d"/><circle cx="7" cy="18" r="1.6" class="d"/></svg>Carte</button>
    <button role="tab" data-view="list" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Liste</button>
  </div>
  <input id="search" type="search" placeholder="Rechercher un appareil, une IP, un fabricant…" autocomplete="off">
  <div id="progress" class="progress" hidden><div class="bar-in" id="progbar"></div><span id="progtext"></span></div>
</nav>
<main>
  <section id="stage" class="stage">
    <div id="map" class="map"></div>
    <div id="list" class="list" hidden></div>
    <div id="empty" class="empty" hidden></div>
  </section>
  <aside id="detail" class="detail" hidden></aside>
</main>
<div id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
